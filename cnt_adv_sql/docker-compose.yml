services:
  db:
    build: .
    image: pg-gis-python:18
    container_name: pg18-gis-python
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dlh_adv_sql}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d
      - ../raw_data:/raw_data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dlh_adv_sql}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
